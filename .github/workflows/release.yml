# Compila o AppImage ao criar uma tag v*-alpha e publica as releases no repositório PÚBLICO
# (RichardtJustke/folio-releases). O código-fonte permanece neste repositório privado.
#
# Segredo necessário: RELEASES_TOKEN — token (fine-grained) com "Contents: read/write"
# somente no repositório folio-releases.
name: release

on:
  push:
    tags: ["v*-alpha"]
  workflow_dispatch:

env:
  PUBLIC_REPO: RichardtJustke/folio-releases

jobs:
  appimage:
    runs-on: ubuntu-22.04 # glibc antiga: o AppImage roda em distros mais velhas
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake libgl1-mesa-dev libxkbcommon-dev libxkbcommon-x11-0 \
            libwayland-dev libfontconfig1-dev libfreetype-dev libegl1-mesa-dev libglib2.0-0 file

      - name: Qt 6
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: linux_gcc_64
          cache: true

      - name: Compilar
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build
          DESTDIR="$PWD/AppDir" cmake --install build

      - name: Empacotar AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QML_SOURCES_PATHS: ${{ github.workspace }}/qml
          EXTRA_PLATFORM_PLUGINS: libqwayland-generic.so;libqwayland-egl.so
          DEPLOY_PLATFORM_THEMES: "1"
          EXTRA_QT_PLUGINS: wayland-shell-integration;wayland-graphic-integration-client;wayland-decoration-client;iconengines;imageformats
          LDAI_OUTPUT: Folio-x86_64.AppImage
        run: |
          curl -fsSL -O https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
          curl -fsSL -O https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/1-alpha-20250213-1/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage
          export PATH="$PWD:$PATH"
          export QMAKE="$QT_ROOT_DIR/bin/qmake"
          ls -la "$QMAKE"
          ./linuxdeploy-x86_64.AppImage --appdir AppDir \
            --desktop-file AppDir/usr/share/applications/folio.desktop \
            --plugin qt --output appimage
          ls -la *.AppImage
          # o app precisa dos plugins do Wayland dentro do pacote
          for d in wayland-shell-integration wayland-graphic-integration-client wayland-decoration-client; do
            test -d "AppDir/usr/plugins/$d" || { echo "faltou o plugin $d"; exit 1; }
          done
          # teste de fumaça: QML carrega e o app fica de pé por 5 s (offscreen, sem display)
          QT_QPA_PLATFORM=offscreen timeout 5 ./Folio-x86_64.AppImage /tmp || [ $? -eq 124 ]
          sha256sum Folio-x86_64.AppImage > SHA256SUMS
          cp assets/folio.svg folio.svg

      - name: Publicar em folio-releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="manual-${GITHUB_RUN_NUMBER}"; fi
          gh release create "$TAG" Folio-x86_64.AppImage SHA256SUMS folio.svg \
            --repo "$PUBLIC_REPO" --title "Folio ${TAG#v}" \
            --notes "Versão ${TAG#v}. Instalação: veja o README."
